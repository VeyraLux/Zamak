[book]
title = "Zamak 语言手册"
authors = ["VeyraLux"]
language = "zh-CN"
description = "学习 Zamak：读起来像 Python、编译成本机代码的静态类型语言。"

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/VeyraLux/Zamak"
edit-url-template = "https://github.com/VeyraLux/Zamak/edit/main/book/zh-CN/{path}"
site-url = "/zh-CN/"
additional-css = ["theme/zamak.css"]
additional-js = ["theme/zamak.js"]
no-section-label = false

[output.html.fold]
enable = false

[build]
create-missing = false
