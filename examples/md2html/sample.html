<h1>Zamak 示例</h1>
<p>Zamak 把 <strong>Markdown</strong> 转成 <em>HTML</em>， 连续的行会合成一个段落。</p>
<h2>列表</h2>
<ul>
<li>支持 <code>行内代码</code></li>
<li>支持 <a href="https://example.com/?a=1&amp;b=2">链接</a></li>
<li>特殊字符 &lt;b&gt; 会被转义</li>
</ul>
<ol>
<li>第一步</li>
<li>第二步：<strong>加粗里的 <em>强调</em></strong></li>
</ol>
<blockquote>
<p>引用也可以，</p>
<p>每行一个段落。</p>
</blockquote>
<pre><code>fn main() {
    println(&quot;&lt;hello&gt;&quot;)
}</code></pre>
<hr>
<p>结尾段落。</p>
