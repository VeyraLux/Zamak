name: Release

# Pushing a tag such as v0.1.0 builds, smoke-tests and publishes prebuilt compilers.
# Running it manually only builds and uploads the archives as workflow artifacts.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux-x64
            binary: zam
          - os: windows-latest
            name: windows-x64
            binary: zam.exe
          - os: macos-latest
            name: macos-arm64
            binary: zam
          # Intel Macs and ARM Linux (Raspberry Pi, ARM servers). Both runners are free for public repositories.
          - os: macos-15-intel
            name: macos-x64
            binary: zam
          - os: ubuntu-22.04-arm
            name: linux-arm64
            binary: zam
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches Cargo version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' zam/Cargo.toml | head -1)
          # A pre-release tag such as v0.1.0-rc.1 builds the version it previews.
          test "v$version" = "${GITHUB_REF_NAME%%-*}" || { echo "tag $GITHUB_REF_NAME does not match Cargo version $version"; exit 1; }
      - name: Build
        run: cargo build --release --locked --manifest-path zam/Cargo.toml
      - name: Package
        shell: bash
        run: bash tools/package-release.sh "zam/target/release/${{ matrix.binary }}" "zamak-${{ matrix.name }}"
      - name: Smoke test packaged compiler
        shell: bash
        run: |
          zam="$PWD/dist/zamak-${{ matrix.name }}/bin/${{ matrix.binary }}"
          work=$(mktemp -d)
          cd "$work"
          export ZAMAK_CACHE_DIR="$work/cache"
          "$zam" --version
          "$zam" new hello
          test "$("$zam" run hello | tr -d '\r')" = "hello from zamak"
          example="$GITHUB_WORKSPACE/dist/zamak-${{ matrix.name }}/examples/collections/wordfreq.zm"
          actual=$(printf 'to be or not to be\n' | "$zam" run "$example" | tr -d '\r')
          expected=$(printf '4 distinct words\n2 to\n2 be\n1 or\n1 not')
          test "$actual" = "$expected" || { echo "unexpected output: $actual"; exit 1; }
      - name: Archive (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cd dist
          tar -czf "zamak-${{ matrix.name }}.tar.gz" "zamak-${{ matrix.name }}"
          shasum -a 256 "zamak-${{ matrix.name }}.tar.gz" > "zamak-${{ matrix.name }}.tar.gz.sha256"
      - name: Test install.sh against the archive (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          (cd dist && python3 -m http.server 8766 --bind 127.0.0.1 >/dev/null 2>&1 &)
          sleep 2
          home="$RUNNER_TEMP/zamak-home"
          ZAMAK_DOWNLOAD_BASE=http://127.0.0.1:8766 ZAMAK_HOME="$home" sh install.sh
          work=$(mktemp -d)
          cd "$work"
          export ZAMAK_CACHE_DIR="$work/cache"
          "$home/bin/zam" new hello
          test "$("$home/bin/zam" run hello)" = "hello from zamak"
      - name: Archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-Location dist
          Compress-Archive -Path "zamak-${{ matrix.name }}" -DestinationPath "zamak-${{ matrix.name }}.zip"
          $hash = (Get-FileHash "zamak-${{ matrix.name }}.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path "zamak-${{ matrix.name }}.zip.sha256" -Value "$hash  zamak-${{ matrix.name }}.zip" -NoNewline
      - name: Test install.ps1 against the archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Start-Process python -ArgumentList '-m','http.server','8766','--bind','127.0.0.1' -WorkingDirectory dist -WindowStyle Hidden
          Start-Sleep -Seconds 2
          $env:ZAMAK_DOWNLOAD_BASE = 'http://127.0.0.1:8766'
          $env:ZAMAK_HOME = Join-Path $env:RUNNER_TEMP 'zamak-home'
          $env:ZAMAK_NO_MODIFY_PATH = '1'
          ./install.ps1
          $work = Join-Path $env:RUNNER_TEMP 'install-smoke'
          New-Item -ItemType Directory -Path $work | Out-Null
          Set-Location $work
          $env:ZAMAK_CACHE_DIR = Join-Path $work 'cache'
          $zam = Join-Path $env:ZAMAK_HOME 'bin/zam.exe'
          & $zam new hello
          $output = (& $zam run hello) -join "`n"
          if ($output.Trim() -ne 'hello from zamak') { throw "unexpected output: $output" }
      - uses: actions/upload-artifact@v4
        with:
          name: zamak-${{ matrix.name }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history, so the notes can link to the changes since the previous tag.
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Release notes from CHANGELOG.md
        run: |
          previous="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          python3 tools/release-notes.py "${GITHUB_REF_NAME#v}" $previous > notes.md
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Tags with a suffix (v0.1.0-rc.1) are pre-releases; plain tags (v0.1.0) are releases.
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" assets/* \
            --title "Zamak $GITHUB_REF_NAME" \
            $prerelease \
            --notes-file notes.md

  # npm: `npm install -g @veyralux/zamak`, `npx @veyralux/zamak`, `bunx @veyralux/zamak`, and `zam upgrade`. Each platform gets a
  # package with its zam; the zamak package picks the right one. Skipped until the NPM_TOKEN secret exists.
  npm:
    if: startsWith(github.ref, 'refs/tags/')
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Publish to npm
        env:
          # The first release publishes with the NPM_TOKEN secret. After that, npm's trusted
          # publishing (OIDC, needs npm 11.5.1 or later) replaces the token: set the repository
          # variable NPM_TRUSTED to true and delete the secret.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TRUSTED: ${{ vars.NPM_TRUSTED }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ] && [ "$NPM_TRUSTED" != "true" ]; then
            echo "Neither NPM_TOKEN nor trusted publishing is set up; skipping npm."
            exit 0
          fi
          npm install -g npm@11
          version="${GITHUB_REF_NAME#v}"
          # Pre-releases go to the "next" tag, so `npm install -g @veyralux/zamak` keeps installing the latest release.
          dist=latest
          case "$version" in *-*) dist=next ;; esac
          node tools/package-npm.mjs "$version" assets npm-out
          # Skip a package whose version is already on npm, and retry a failed publish: the signature
          # log npm uses for provenance sometimes answers with a conflict (409) that goes away.
          publish() {
            package="$1"
            # The name on npm (the main package is @veyralux/zamak) isn't always the folder name.
            published="$(node -p "require('./npm-out/$package/package.json').name")"
            for attempt in 1 2 3; do
              if npm view "$published@$version" version >/dev/null 2>&1; then
                echo "$published@$version is on npm."
                return 0
              fi
              (cd "npm-out/$package" && npm publish --access public --provenance --tag "$dist") && return 0
              echo "npm publish failed for $package (attempt $attempt of 3)."
              sleep 30
            done
            return 1
          }
          for package in zamak-win32-x64 zamak-linux-x64 zamak-linux-arm64 zamak-darwin-arm64 zamak-darwin-x64 zamak; do
            publish "$package"
          done

  # VS Code extension: published to the Marketplace with the VSCE_PAT secret (an Azure DevOps token for the
  # veyralux publisher), and to Open VSX with OVSX_PAT if it exists. The .vsix is attached to the release either way.
  # Pre-releases (v0.2.0-rc.1) only attach the .vsix.
  vscode:
    if: startsWith(github.ref, 'refs/tags/')
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Package and publish
        working-directory: editors/vscode
        env:
          GH_TOKEN: ${{ github.token }}
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          npm ci
          npm version "$version" --no-git-tag-version --allow-same-version
          npx --yes @vscode/vsce@3 package --out "zamak-$version.vsix"
          gh release upload "$GITHUB_REF_NAME" "zamak-$version.vsix" --clobber
          case "$version" in *-*) echo "pre-release: not publishing the extension"; exit 0 ;; esac
          if [ -n "$VSCE_PAT" ]; then
            npx --yes @vscode/vsce@3 publish --packagePath "zamak-$version.vsix" -p "$VSCE_PAT"
          else
            echo "VSCE_PAT is not set; upload zamak-$version.vsix to the Marketplace by hand."
          fi
          if [ -n "$OVSX_PAT" ]; then
            npx --yes ovsx@0 publish "zamak-$version.vsix" -p "$OVSX_PAT"
          fi

  # The Zamak Book at zamak.veyralux.org: deployed with the CLOUDFLARE_API_TOKEN secret (Workers edit permission for
  # the veyralux.org zone) and the CLOUDFLARE_ACCOUNT_ID secret. Only full releases deploy; pre-releases don't.
  book:
    if: startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-')
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN is not set; deploy the book by hand."
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/mdbook"
          curl -fsSL https://github.com/rust-lang/mdBook/releases/download/v0.5.4/mdbook-v0.5.4-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz -C "$RUNNER_TEMP/mdbook"
          export PATH="$RUNNER_TEMP/mdbook:$PATH"
          python3 book/build.py
          cd book
          npx --yes wrangler@4 deploy
